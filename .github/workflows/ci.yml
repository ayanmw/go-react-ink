name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check gofmt
        run: |
          GOFMT_OUTPUT=$(gofmt -s -d .)
          if [ -n "$GOFMT_OUTPUT" ]; then
            echo "::error::gofmt found formatting issues"
            echo "$GOFMT_OUTPUT"
            exit 1
          fi
          echo "✓ gofmt: No formatting issues"

      - name: Run go vet
        run: go vet ./...

      - name: Install golint
        run: go install golang.org/x/lint/golint@latest

      - name: Run golint
        run: |
          golint ./... 2>&1 | grep -v "KeyF[0-9]" | grep -v "KeyCtrl" > lint_output.txt || true
          if [ -s lint_output.txt ]; then
            echo "::warning::golint found warnings"
            cat lint_output.txt
          else
            echo "✓ golint: No issues"
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.out
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [test, lint]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            binary: gox
            binary-lsp: gox-lsp
          - os: windows-latest
            binary: gox.exe
            binary-lsp: gox-lsp.exe
          - os: macos-latest
            binary: gox
            binary-lsp: gox-lsp
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build gox compiler
        run: go build -v -o ${{ matrix.binary }} ./cmd/gox

      - name: Build LSP server
        run: |
          cd tools/lsp-server
          go build -v -o ../../${{ matrix.binary-lsp }} .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.binary-lsp }}

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run benchmarks
        run: go test -bench=. -benchtime=1s ./pkg/layout/...
