name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check gofmt
        run: |
          echo "=== Checking gofmt ==="
          GOFMT_OUTPUT=$(gofmt -s -d .)
          if [ -n "$GOFMT_OUTPUT" ]; then
            echo "::error::gofmt found formatting issues"
            echo "$GOFMT_OUTPUT"
            echo ""
            echo "Run 'gofmt -s -w .' to fix these issues"
            exit 1
          fi
          echo "✓ gofmt: No formatting issues"

      - name: Run go vet
        run: |
          echo "=== Running go vet ==="
          go vet ./...
          echo "✓ go vet: No issues"

      - name: Install golint
        run: |
          echo "=== Installing golint ==="
          go install golang.org/x/lint/golint@latest
          echo "✓ golint installed"

      - name: Run golint
        run: |
          echo "=== Running golint ==="
          # Filter out acceptable warnings (F-keys and Ctrl keys in tcell)
          golint ./... 2>&1 | grep -v "KeyF[0-9]" | grep -v "KeyCtrl" > lint_output.txt || true
          if [ -s lint_output.txt ]; then
            echo "::warning::golint found warnings"
            cat lint_output.txt
            echo ""
            echo "Note: Some lint warnings may be acceptable. Review and fix as needed."
          else
            echo "✓ golint: No issues"
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m