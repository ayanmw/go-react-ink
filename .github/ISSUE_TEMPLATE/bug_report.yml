name: Bug Report
description: Report a bug in go-react-ink
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Create file '...'
        2. Run command '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Go Version
      placeholder: "go1.21.0"
    validations:
      required: true

  - type: input
    id: gox-version
    attributes:
      label: GoX Version
      placeholder: "v0.1.0"

  - type: textarea
    id: code
    attributes:
      label: Code Sample
      description: A minimal code sample that reproduces the issue
      render: go